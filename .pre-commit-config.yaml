# =============================================================================
# .pre-commit-config.yaml — Deep Research Agent M1 (FEATURE-001-m1-infra)
# =============================================================================
# Pre-commit hook chain. Tool versions are PINNED to match requirements-dev.txt
# (T015 — feat/m1-us3-pr-gate::fd7e66b) and research_frontend/package.json
# devDependencies so a local commit matches what CI (.github/workflows/ci.yml)
# runs — byte-for-byte.
#
# Constitution alignment:
#   - I  (Security-First) — gitleaks blocks any secret leak
#   - II (Spec / Owner)   — commitlint enforces Conventional Commits so the
#                            `Spec:` / `Owner:` fields survive auto-merge
#   - III (Test-First)    — pre-commit cannot run the full test suite; CI does
#                            that. Hooks only enforce lint+format so commits
#                            never land red-only-because-of-style.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg   # commitlint hook
#
# Run on demand:
#   pre-commit run --all-files
#
# Owner: Dev.cai.4  [T005 + T075 + T076]
# =============================================================================

# Default stage — only run on commit. CI re-runs the same hooks on PR.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# Fail-fast semantics per Constitution I — first failing hook aborts the
# commit. Authors run `pre-commit run --all-files` to see all violations.
fail_fast: false

repos:
  # --------------------------------------------------------------------------
  # 1. Secret scanner — Constitution I (Security-First)
  # --------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # --------------------------------------------------------------------------
  # 2. Python — ruff lint + format (matches requirements-dev.txt T015)
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(research_backend/)
      - id: ruff-format
        files: ^(research_backend/)

  # --------------------------------------------------------------------------
  # 3. Frontend — prettier (matches package.json devDeps)
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
        files: ^research_frontend/
        additional_dependencies:
          - prettier@3.4.2
          - prettier-plugin-tailwindcss@0.6.9

  # --------------------------------------------------------------------------
  # 4. Frontend — eslint (matches package.json devDeps)
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: ^research_frontend/
        additional_dependencies:
          - eslint@9.17.0
          - eslint-config-next@16.4.2
          - "@typescript-eslint/eslint-plugin@8.19.0"
          - "@typescript-eslint/parser@8.19.0"

  # --------------------------------------------------------------------------
  # 5. Commit message — conventional commits (matches .commitlintrc.json)
  # --------------------------------------------------------------------------
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/cli@19.6.0"
          - "@commitlint/config-conventional@19.6.0"