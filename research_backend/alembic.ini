[alembic]
# Alembic 迁移配置（M1 init）
# Alembic 通过 DATABASE_URL 同步 driver（去掉 +asyncpg）连接
script_location = app/db/migrations

# 警告：此处为 stub；生产环境使用 env.py 中的 init 钩子
# 优先 os.environ.get("DATABASE_URL_SYNC")
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/postgres

version_table = alembic_version
timezone = UTC
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
